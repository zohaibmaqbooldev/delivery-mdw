name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: delivery-mdw
        run: npm install

      - name: Build web app
        working-directory: delivery-mdw
        run: npm run build

      - name: Capacitor sync
        working-directory: delivery-mdw
        run: npx cap sync android

      - name: Build APK Debug
        working-directory: delivery-mdw/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: delivery-mdw/android/app/build/outputs/apk/debug/app-debug.apk
